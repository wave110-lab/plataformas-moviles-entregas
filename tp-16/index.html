<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorAPI Explorer - Bootstrap</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4" style="max-width: 900px;">
        <h2 class="mb-3">MotorAPI Explorer</h2>
        
        <input type="text" id="searchInput" class="form-control mb-4" placeholder="Buscar marca..." oninput="filtrarMarcas()">

        <div id="loading" class="text-muted fst-italic my-3">Cargando datos...</div>
        <div id="results" class="row g-3"></div>
    </div>

    <!-- Modal de Bootstrap -->
    <div class="modal fade" id="modelosModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Modelos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="modalLoading" class="text-muted fst-italic" style="display:none;">Cargando modelos...</div>
                    <ul id="modelList" class="list-group list-group-flush"></ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS de Bootstrap 5 (necesario para el funcionamiento del Modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let todasLasMarcas = [];
        const modalBootstrap = new bootstrap.Modal(document.getElementById('modelosModal'));

        async function obtenerDatosAPI() {
            const url = 'https://vpic.nhtsa.dot.gov/api/vehicles/getallmakes?format=json';
            try {
                const response = await fetch(url);
                const data = await response.json();
                todasLasMarcas = data.Results;
                
                document.getElementById('loading').style.display = 'none';
                mostrarEnPantalla(todasLasMarcas.slice(0, 20));
            } catch (error) {
                document.getElementById('loading').innerHTML = '<div class="alert alert-danger">Error de conexión con la API.</div>';
                console.error(error);
            }
        }

        function mostrarEnPantalla(marcas) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (marcas.length === 0) {
                resultsDiv.innerHTML = '<p class="text-muted">No se encontraron marcas.</p>';
                return;
            }

            marcas.forEach(marca => {
                const col = document.createElement('div');
                col.className = 'col-sm-6 col-md-4';
                col.innerHTML = `
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div class="mb-3">
                                <h6 class="card-title fw-bold mb-1">${marca.Make_Name}</h6>
                                <small class="text-muted">ID: ${marca.Make_ID}</small>
                            </div>
                            <button class="btn btn-primary btn-sm w-100" onclick="verModelos(${marca.Make_ID}, '${marca.Make_Name.replace(/'/g, "\\'")}')">Ver Modelos</button>
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(col);
            });
        }

        function filtrarMarcas() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            const filtradas = todasLasMarcas.filter(m => m.Make_Name.toLowerCase().includes(texto));
            mostrarEnPantalla(filtradas.slice(0, 20));
        }

        async function verModelos(makeId, makeName) {
            const modalTitle = document.getElementById('modalTitle');
            const modalLoading = document.getElementById('modalLoading');
            const modelList = document.getElementById('modelList');

            modalTitle.innerText = `Modelos de: ${makeName}`;
            modelList.innerHTML = '';
            modalLoading.style.display = 'block';
            modalBootstrap.show();

            const urlModelos = `https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeId/${makeId}?format=json`;

            try {
                const response = await fetch(urlModelos);
                const data = await response.json();
                modalLoading.style.display = 'none';

                if (data.Results.length === 0) {
                    modelList.innerHTML = '<p class="text-muted">No hay modelos registrados.</p>';
                    return;
                }

                data.Results.forEach(modelo => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `
                        <span>${modelo.Model_Name}</span>
                        <span class="badge bg-secondary">ID: ${modelo.Model_ID}</span>
                    `;
                    modelList.appendChild(li);
                });

            } catch (error) {
                modalLoading.style.display = 'none';
                modelList.innerHTML = '<div class="alert alert-danger">Error al cargar los modelos.</div>';
                console.error(error);
            }
        }

        obtenerDatosAPI();
    </script>
</body>
</html>
